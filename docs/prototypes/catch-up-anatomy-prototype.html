## Where you are
Hyde has vanished since the murder of Sir Danvers Carew. Dr Lanyon has died after a shock he refused to explain. Jekyll, after a few sociable months, has shut himself away again, and Utterson and Enfield have just seen him at his window, suddenly seized by terror.

  md: `# Catch-up: Strange Case of Dr Jekyll and Mr Hyde by Robert Louis Stevenson

## Previously…
It starts with a door. On a Sunday walk, **Mr Enfield** tells his relative, the reserved lawyer **Mr Utterson**, about a night he saw a small man trample a child and walk on. Made to pay damages, the man disappeared behind a shabby door and came back with a cheque signed by a highly respectable name. The man was called **Hyde**.

The name troubles Utterson, because his friend **Dr Henry Jekyll** has made a will leaving everything to an "Edward Hyde", even if Jekyll should merely disappear for three months. Jekyll's old friend **Dr Lanyon** has never heard of Hyde. Utterson waits by the door until he meets Hyde himself, and comes away with a disgust he can't put into words. Jekyll, pressed at dinner, only asks Utterson to make sure Hyde gets his rights.

Nearly a year later, a maid sees Hyde beat the elderly **Sir Danvers Carew** to death. The broken cane is one Utterson once gave Jekyll. Hyde's rooms in Soho are ransacked, and Hyde is gone. A shaken, sickly Jekyll swears he is finished with him and shows a farewell letter from Hyde, yet his butler **Poole** saw no letter arrive, and Utterson's clerk **Guest** notices the handwriting is strangely like Jekyll's.

For two months Jekyll seems himself again. Then his door closes. Lanyon, looking like a man who has seen his death warrant, says he has had a shock he will never recover from, refuses to speak of Jekyll, and dies, leaving Utterson an envelope not to be opened until Jekyll's death or disappearance.

**And this is where you stopped:** walking past the courtyard, Utterson and Enfield see Jekyll at his window, pale, chatting, until an expression of abject terror and despair crosses his face and the window slams shut. The two men walk on in silence. "God forgive us," says Utterson.

---

**Still unanswered:** Hyde's hold over Jekyll · the strange will · Lanyon's shock and envelope · the handwriting · where Hyde is.

**Cast:** Utterson (lawyer, investigating) · Jekyll (doctor) · Hyde (wanted for murder) · Lanyon (dead) · Enfield (Utterson's relative) · Poole (butler) · Guest (clerk) · Carew (murdered MP)`},

  md: `# Catch-up: Strange Case of Dr Jekyll and Mr Hyde by Robert Louis Stevenson
${HEADER}

## The story so far
**The will.** The lawyer **Utterson** has an old friend, **Dr Jekyll**, and a growing worry about him. On a Sunday walk, Utterson's relative **Enfield** tells of a small man who trampled a child at night, then paid her family with a cheque signed by a highly respectable name, fetched from behind a shabby door (Ch. 1). The man's name, Hyde, alarms Utterson, because Jekyll's will leaves everything to an Edward Hyde, even if Jekyll merely disappears for three months. Jekyll's old friend **Dr Lanyon** has never heard of him, so Utterson waits by the door until he meets Hyde himself, and comes away with a disgust he cannot explain (Ch. 2). Jekyll's butler **Poole** says the servants have orders to obey Hyde, who has a key to the laboratory. When Utterson raises the will, Jekyll refuses to discuss it and makes him promise to see that Hyde gets his rights (Ch. 3).

**The murder.** Nearly a year later, a maid sees Hyde beat the elderly **Sir Danvers Carew** to death. Because the broken cane is one Utterson once gave Jekyll, Utterson leads the police to Hyde's rooms in Soho, but Hyde has fled (Ch. 4). A sickly Jekyll swears he is done with Hyde and shows a letter in which Hyde says he has a safe means of escape. Yet Poole saw no letter delivered, and Utterson's clerk **Guest** notices that Hyde's handwriting is strangely like Jekyll's, only sloped differently. Utterson concludes, with horror, that Jekyll may have forged a letter for a murderer (Ch. 5).

**The withdrawal.** With Hyde gone, Jekyll returns to society for two good months, then suddenly shuts his door. Utterson finds Lanyon looking like a man under a death sentence: he has had a shock he will never recover from and refuses to speak of Jekyll. Lanyon dies within weeks, leaving Utterson an envelope "not to be opened till the death or disappearance of Dr. Henry Jekyll". Jekyll writes that he will now live in seclusion (Ch. 6).

## Where you are
Hyde has vanished since the murder, Lanyon is dead, and Jekyll has shut himself away, ill. Utterson still wants to understand Jekyll's tie to Hyde.

In the last scene, on another Sunday walk, Enfield says that at least the Hyde story is over. He has realised the shabby door is the back way into Jekyll's house, so the two men step into the courtyard. At a half-open window sits Jekyll, "like some disconsolate prisoner". He says he is very low and declines to come down, but is glad to talk from the window. Then, mid-conversation, his smile is struck from his face by "an expression of such abject terror and despair, as froze the very blood" of the men below. The window is thrust down at once. The two walk away in silence, pale, until Utterson says, "God forgive us."

## Open threads
- What hold does Hyde have over Jekyll, and why does the will provide for a mere "disappearance"?
- What shock destroyed Lanyon, and what is in his envelope?
- Why does Hyde's handwriting resemble Jekyll's?
- Where is Hyde?
- What did Jekyll see, or feel, at the window?
- Utterson still means to learn what Jekyll is hiding. Jekyll means to stay shut away.

---

- **Dr Henry Jekyll**: respected doctor, Utterson's friend. Wants to be left alone; says he is finished with Hyde. Ill and secluded.

- **The laboratory**: the old dissecting theatre behind Jekyll's house, where Jekyll works. Hyde has a key.

- **The shabby door**: a neglected door on a back street, the laboratory's rear entrance. Where Enfield saw Hyde go in, and where Utterson waited for him.
- **Soho**: the district where Hyde had his rooms, searched after the murder.`}

const KEYS = Object.keys(VARIANTS);
let raw = false;
const params = new URLSearchParams(location.search);
let current = KEYS.includes(params.get("variant")) ? params.get("variant") : "A";

function render() {
  const v = VARIANTS[current];
  document.getElementById("brief").innerHTML =
    `<h2>${current} · ${v.name}</h2><p><strong>Idea:</strong> ${v.idea}</p><p><strong>Judge it by:</strong> ${v.judge}</p>`;
  const out = document.getElementById("out");
  if (raw || !window.marked) out.innerHTML = `<pre class="raw"></pre>`, out.firstChild.textContent = v.md;
  else out.innerHTML = marked.parse(v.md);
  const words = v.md.split(/\s+/).filter(Boolean).length;
  document.getElementById("stats").textContent =
    `${v.md.length.toLocaleString()} chars · ${words} words · ~${Math.max(1, Math.round(words / 230))} min read`;
  document.getElementById("rawToggle").textContent = raw ? "Show rendered" : "Show raw Markdown";
  document.getElementById("label").textContent = `${current} (${v.name})`;
  const url = new URL(location.href); url.searchParams.set("variant", current);
  history.replaceState(null, "", url);
  window.scrollTo(0, 0);
}
function step(d) { current = KEYS[(KEYS.indexOf(current) + d + KEYS.length) % KEYS.length]; render(); }
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("rawToggle").onclick = () => { raw = !raw; render(); };
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t.closest && t.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
render();
